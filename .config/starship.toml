add_newline = true
right_format = "$git_state$custom"

[directory]
truncate_to_repo = false
truncation_length = 0

[git_branch]
symbol = " "

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[git_status]
disabled = true

[nodejs]
disabled = true

[gcloud]
disabled = true

[custom.git_clean]
require_repo = true
when = 'test -z "$(git status --porcelain 2>/dev/null)"'
symbol = "●"
style = "bold green"
format = "[$symbol]($style)"

[custom.git_untracked]
require_repo = true
when = 'test -n "$(git status --porcelain 2>/dev/null)" && test -z "$(git status --porcelain 2>/dev/null | grep -v "^??")"'
symbol = "●"
style = "bold yellow"
format = "[$symbol]($style)"

[custom.git_dirty]
require_repo = true
when = 'test -n "$(git status --porcelain 2>/dev/null | grep -v "^??")"'
symbol = "●"
style = "bold red"
format = "[$symbol]($style)"
